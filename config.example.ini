# wra - WebApp Risk Assessment - example configuration
#
# Copy this file to config.ini (git-ignored) and edit it:
#   cp config.example.ini config.ini && chmod 600 config.ini
#
# Never put passwords, tokens or private keys in this file.

[scope]
# Set to "yes" ONLY if you hold written authorization to test every host below.
authorized = no
# Comma-separated hostnames, IP addresses or CIDR networks allowed as targets.
# wra refuses to run if the URL host or the SSH host is not listed here.
hosts = 192.168.122.93

[target]
# Base URL of the web application to assess.
url = https://192.168.122.93/
# Accept invalid or self-signed TLS certificates while scanning.
# The invalid certificate is still reported as a finding.
insecure_tls = yes
# Network timeout in seconds for native HTTP checks.
timeout = 15

[ssh]
# Leave "host" empty for an external-only assessment (access level "none").
host =
port = 22
user = wra-user
key_path = ~/.ssh/wra_audit
# Dedicated known_hosts file, populated by a first manual connection
# (see README). wra always uses StrictHostKeyChecking=yes.
known_hosts = ~/.ssh/wra_known_hosts
connect_timeout = 10

[app]
# Optional. Paths ON THE TARGET host; empty = autodetect.
source_path =
compose_path =

[db]
# engine: postgresql | mysql | auto
engine = auto
# access: docker_exec (via the DB container) | tcp | none
access = docker_exec
host = 127.0.0.1
port = 5432
user =
database =
# Container name when access = docker_exec; empty = autodetect.
container =
# The DB password is read from the environment variable WRA_DB_PASSWORD
# or from the file below (must be mode 600). Never write it here.
password_file =

[runtime]
# Container engine used to run third-party tools: podman | docker
engine = podman
# mode: container (default) | local (use tools already in PATH when present)
mode = container
# Extra arguments for every "<engine> run" (e.g. reach a libvirt VM from rootless podman).
extra_args = --network host
# Bind-mount options: auto (adds :Z when SELinux is enabled) | Z | z | none
volume_opts = auto
# Refuse images that are not pinned by digest (supply-chain protection).
allow_unpinned = no

[tool_args]
# Per-tool extra arguments for "<engine> run".
zap = --userns=keep-id

[images]
# Pin every image by digest: repository@sha256:<digest>
# Get it with: podman image inspect --format '{{index .RepoDigests 0}}' <image>
nmap = docker.io/instrumentisto/nmap@sha256:REPLACE_ME
zap = docker.io/zaproxy/zap-stable@sha256:REPLACE_ME
nuclei = docker.io/projectdiscovery/nuclei@sha256:REPLACE_ME
ssh-audit = docker.io/positronsecurity/ssh-audit@sha256:REPLACE_ME
trivy = docker.io/aquasec/trivy@sha256:REPLACE_ME
semgrep = docker.io/semgrep/semgrep@sha256:REPLACE_ME
trufflehog = docker.io/trufflesecurity/trufflehog@sha256:REPLACE_ME

[scoring]
# Risk = impact x likelihood (1-25). Band upper bounds (inclusive).
low_max = 6
medium_max = 12
